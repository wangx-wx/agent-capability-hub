openapi: 3.0.3
info:
  title: Legacy items
  version: '1.0'
servers:
  - url: __SERVER__
paths:
  /items:
    post:
      operationId: create-item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, serverId]
              additionalProperties: false
              properties:
                name:
                  type: string
                  nullable: true
                  minLength: 2
                amount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 10
                  exclusiveMaximum: true
                serverId:
                  type: integer
                  readOnly: true
                status:
                  type: string
                  nullable: true
                  enum: [ok]
      responses:
        '200':
          description: Created
